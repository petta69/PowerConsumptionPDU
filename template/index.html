<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Live Power Consumption</title>
    <style>
        /* Make the body background black and center content */
        body {
            background-color: #000000;
            color: #ffffff; /* Makes text white so it is readable */
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: sans-serif;
        }

        h1 {
            margin-bottom: 20px;
        }

        /* Optional: Restrict max image size if needed */
        #live-image {
            max-width: 90vw;
            max-height: 70vh;
            object-fit: contain;
            border-radius: 8px; /* Optional: smooth corners */
        }
    </style>
</head>
<body>
    
    <img id="live-image" src="{{ url_for('static', path='powerchart.png') | cache_bust }}" alt="Dynamic Image">

    <script>
        const imgElement = document.getElementById('live-image');
        const baseSrc = imgElement.src.split('?')[0]; // Safe split to extract base URL

        async function checkForImageUpdate() {
            try {
                const response = await fetch('/api/image-version');
                const data = await response.json();
                
                const newSrc = `${baseSrc}?v=${data.version}`;
                
                if (imgElement.src !== newSrc) {
                    imgElement.src = newSrc;
                    console.log("Image updated to version:", data.version);
                }
            } catch (error) {
                console.error("Error checking for image update:", error);
            }
        }

        setInterval(checkForImageUpdate, 3000);
    </script>
</body>
</html>
